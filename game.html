<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Train - Arène</title>
    <link rel="stylesheet" href="game-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Avenir&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>
    
    <div id="ready-screen">
        <h1 id="ready-title">Préparation du Train...</h1>
        <p id="status-text">Connexion au réseau...</p>
        <div class="players-status">
            <div class="player-box"><h3 id="my-name">Moi</h3><span id="my-ready-status" class="status-badge not-ready">Pas Prêt</span></div>
            <div class="player-box"><h3 id="enemy-name-ready">Adversaire</h3><span id="enemy-ready-status" class="status-badge not-ready">Pas Prêt</span></div>
        </div>
        <button id="ready-btn" onclick="toggleReady()" disabled>Je suis Prêt !</button>
    </div>

    <div id="game-content" style="display: none;">
        <div class="top-bar">
            <h1>🚂 Monster Train - Round <span id="round-number">1</span>/7</h1>
            <div id="score-display"><span id="my-name-score">Toi</span> <span id="my-score">0</span> - <span id="enemy-score">0</span> <span id="enemy-name-score">Adv</span></div>
        </div>
        
        <div class="game-area">
            <div id="header-info">
                <h2 id="phase-title">🚂 Phase de Préparation</h2>
                <div id="timer-display">⏳ --</div>
            </div>
            
            <div id="board">
                <div class="track-loop player-track"></div>
                <div class="track-loop enemy-track"></div>

                <div class="gare-box" style="left: 190px; top: 60px;">Gare 1</div>
                <div class="gare-box" style="left: 50px; top: 160px;">Gare 2</div>
                <div class="gare-box" style="left: 50px; top: 280px;">Gare 3</div>
                <div class="gare-box" style="left: 50px; top: 400px;">Gare 4</div>
                <div class="gare-box" style="left: 190px; top: 500px;">Gare 5</div>

                <div class="gare-box" style="left: 550px; top: 60px;">Gare 1</div>
                <div class="gare-box" style="left: 690px; top: 160px;">Gare 2</div>
                <div class="gare-box" style="left: 690px; top: 280px;">Gare 3</div>
                <div class="gare-box" style="left: 690px; top: 400px;">Gare 4</div>
                <div class="gare-box" style="left: 550px; top: 500px;">Gare 5</div>

                <div class="vs-badge" style="left: 382px; top: 110px;">VS</div>
                <div class="vs-badge" style="left: 382px; top: 210px;">VS</div>
                <div class="vs-badge" style="left: 382px; top: 310px;">VS</div>
                <div class="vs-badge" style="left: 382px; top: 410px;">VS</div>
                <div class="vs-badge" style="left: 382px; top: 510px;">VS</div>

                <div id="wagons-layer"></div>
                <div id="loco">🚂</div><div id="enemy-loco">🚂</div>
            </div>

            <div id="bottom-section">
                <div id="decks-container">
                    <div class="deck-pile deck-combat" id="deck-combat"><span>Combat</span><span class="deck-count" id="count-combat">60</span></div>
                    <div class="deck-pile deck-soutien" id="deck-soutien"><span>Soutien</span><span class="deck-count" id="count-soutien">20</span></div>
                    <div class="deck-pile deck-sabotage" id="deck-sabotage"><span>Sabot.</span><span class="deck-count" id="count-sabotage">20</span></div>
                </div>
                <div id="player-hand-section"><h3 id="instruction-text">Distribution...</h3><div id="hand-container"></div></div>
            </div>
        </div>
    </div>
    <div id="animation-layer"></div>
    <script src="js/game.js"></script>
</body>
</html>
