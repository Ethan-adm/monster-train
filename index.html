<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Train - Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Avenir&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
    <h1>🚂 Monster Train</h1>
    
    <div class="game-area">
        
        <div id="battle-arena">
            <h2>Ligne de Front (Les 5 Gares)</h2>
            <div class="tracks-container">
                
                <div class="station-row">
                    <div class="wagon-slot player-slot" id="p-slot-1"><span class="slot-text">Ton Wagon 1</span></div>
                    <div class="station-center">
                        <div class="station-number">Gare 1</div>
                        <div class="vs-badge">VS</div>
                    </div>
                    <div class="wagon-slot enemy-slot" id="e-slot-1"><span class="slot-text">Ennemi 1</span></div>
                </div>

                <div class="station-row">
                    <div class="wagon-slot player-slot" id="p-slot-2"><span class="slot-text">Ton Wagon 2</span></div>
                    <div class="station-center">
                        <div class="station-number">Gare 2</div>
                        <div class="vs-badge">VS</div>
                    </div>
                    <div class="wagon-slot enemy-slot" id="e-slot-2"><span class="slot-text">Ennemi 2</span></div>
                </div>

                <div class="station-row">
                    <div class="wagon-slot player-slot" id="p-slot-3"><span class="slot-text">Ton Wagon 3</span></div>
                    <div class="station-center">
                        <div class="station-number">Gare 3</div>
                        <div class="vs-badge">VS</div>
                    </div>
                    <div class="wagon-slot enemy-slot" id="e-slot-3"><span class="slot-text">Ennemi 3</span></div>
                </div>

                <div class="station-row">
                    <div class="wagon-slot player-slot" id="p-slot-4"><span class="slot-text">Ton Wagon 4</span></div>
                    <div class="station-center">
                        <div class="station-number">Gare 4</div>
                        <div class="vs-badge">VS</div>
                    </div>
                    <div class="wagon-slot enemy-slot" id="e-slot-4"><span class="slot-text">Ennemi 4</span></div>
                </div>

                <div class="station-row">
                    <div class="wagon-slot player-slot" id="p-slot-5"><span class="slot-text">Ton Wagon 5</span></div>
                    <div class="station-center">
                        <div class="station-number">Gare 5</div>
                        <div class="vs-badge">VS</div>
                    </div>
                    <div class="wagon-slot enemy-slot" id="e-slot-5"><span class="slot-text">Ennemi 5</span></div>
                </div>

            </div>
        </div>

        <div id="player-hand-section">
            <h2>Ta Main (<span id="deck-count">60</span> cartes dans le deck)</h2>
            <div id="hand-container">
                </div>
            <button id="draw-btn" onclick="demarrerPartie()">Piocher le 1er tour (8 cartes)</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
