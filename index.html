<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Train - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🚂 Monster Train</h1>
    
    <div class="game-area">
        <div id="train-board">
            <h2>Tes Wagons</h2>
            <div class="wagons-container">
                <div class="wagon" id="wagon-1">Wagon 1</div>
                <div class="wagon" id="wagon-2">Wagon 2</div>
                <div class="wagon" id="wagon-3">Wagon 3</div>
                <div class="wagon" id="wagon-4">Wagon 4</div>
                <div class="wagon" id="wagon-5">Wagon 5</div>
            </div>
        </div>

        <div id="player-hand-section">
            <h2>Ta Main (<span id="deck-count">60</span> cartes dans le deck)</h2>
            <div id="hand-container">
                </div>
            <button id="draw-btn" onclick="demarrerPartie()">Piocher le 1er tour (8 cartes)</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
