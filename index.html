<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Train - Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Avenir&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
    <h1>🚂 Monster Train</h1>
    
    <div class="game-area">
        <h2 id="phase-title">🚂 Phase de Préparation : Remplis tes wagons !</h2>
        
        <div id="board">
            <div class="u-track player-track"></div>
            <div class="u-track enemy-track"></div>

            <div class="gare-label" style="left: 15px; top: 65px;">Gare 1</div>
            <div class="gare-label" style="left: 15px; top: 165px;">Gare 2</div>
            <div class="gare-label" style="left: 15px; top: 265px;">Gare 3</div>
            <div class="gare-label" style="left: 15px; top: 365px;">Gare 4</div>
            <div class="gare-label" style="left: 15px; top: 465px;">Gare 5</div>

            <div class="enemy-combat-slot" style="left: 420px; top: 450px;">E1</div>
            <div class="enemy-combat-slot" style="left: 420px; top: 350px;">E2</div>
            <div class="enemy-combat-slot" style="left: 420px; top: 250px;">E3</div>
            <div class="enemy-combat-slot" style="left: 420px; top: 150px;">E4</div>
            <div class="enemy-combat-slot" style="left: 420px; top: 50px;">E5</div>

            <div class="vs-badge" style="left: 382px; top: 465px;">VS</div>
            <div class="vs-badge" style="left: 382px; top: 365px;">VS</div>
            <div class="vs-badge" style="left: 382px; top: 265px;">VS</div>
            <div class="vs-badge" style="left: 382px; top: 165px;">VS</div>
            <div class="vs-badge" style="left: 382px; top: 65px;">VS</div>

            <div id="wagons-layer"></div>
            
            <div id="loco">🚂</div>
        </div>

        <div id="player-hand-section">
            <h3 id="instruction-text">Pioche tes cartes pour commencer ! (<span id="deck-count">60</span> dans le deck)</h3>
            <div id="hand-container"></div>
            <button id="draw-btn" onclick="demarrerPartie()">Piocher le 1er tour (8 cartes)</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
