<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Train - Prototype</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Avenir&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
    <h1>🚂 Monster Train</h1>
    
    <div class="game-area">
        <div id="train-board">
            <h2>Train Board</h2>
            <div class="wagons-container">
                <div class="wagon" id="wagon-1">
                    <div class="wagon-pane"></div>
                    <div class="wagon-label"><span>Wagon</span> <span class="wagon-number">1</span></div>
                </div>
                <div class="wagon" id="wagon-2">
                    <div class="wagon-pane"></div>
                    <div class="wagon-label"><span>Wagon</span> <span class="wagon-number">2</span></div>
                </div>
                <div class="wagon" id="wagon-3">
                    <div class="wagon-pane"></div>
                    <div class="wagon-label"><span>Wagon</span> <span class="wagon-number">3</span></div>
                </div>
                <div class="wagon" id="wagon-4">
                    <div class="wagon-pane"></div>
                    <div class="wagon-label"><span>Wagon</span> <span class="wagon-number">4</span></div>
                </div>
                <div class="wagon" id="wagon-5">
                    <div class="wagon-pane"></div>
                    <div class="wagon-label"><span>Wagon</span> <span class="wagon-number">5</span></div>
                </div>
            </div>
            <div class="track-visual"></div>
        </div>

        <div id="player-hand-section">
            <h2>Ta Main (<span id="deck-count">60</span> cartes dans le deck)</h2>
            <div id="hand-container">
                </div>
            <button id="draw-btn" onclick="demarrerPartie()">Piocher le 1er tour (8 cartes)</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
